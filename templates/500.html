
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | Barangay Alaga</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #FFF9F7;
            font-family: Arial, sans-serif;
            color: #342329;
        }

        .navbar {
            background: #4A0E19;
            color: white;
            padding: 20px 8%;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            min-height: calc(100vh - 66px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .error-card {
            background: white;
            width: 100%;
            max-width: 520px;
            padding: 50px 35px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(74, 14, 25, 0.08);
        }

        .error-code {
            font-size: 90px;
            font-weight: bold;
            color: #751C2B;
            margin: 0;
        }

        h1 {
            color: #4A0E19;
            font-size: 28px;
            margin: 10px 0 15px;
        }

        p {
            color: #725B60;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: #751C2B;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: bold;
        }

        .button:hover {
            background: #4A0E19;
        }

        .footer {
            margin-top: 35px;
            font-size: 12px;
            color: #927D82;
        }
    </style>
</head>

<body>

    <header class="navbar">
        Barangay Alaga
    </header>

    <main class="container">
        <section class="error-card">

            <p class="error-code">500</p>

            <h1>Something Went Wrong</h1>

            <p>
                We encountered an unexpected error.
                Please try again later.
            </p>

            <a href="/" class="button">
                Return to Home
            </a>

            <div class="footer">
                Barangay Alaga | Healthcare Appointment System
            </div>

        </section>
    </main>

</body>
</html>
